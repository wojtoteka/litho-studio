<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Litho Studio">
  <title>Litho Studio</title>
  <desc>
    Znak łączy nawias kodu &lt; / &gt; z kursorem myszy — przejście od kodu do edycji
    wizualnej i z powrotem. Geometria musi być identyczna jak w
    src/components/Logo.tsx — z tego pliku scripts/generate-icons.mjs renderuje
    ikony instalacyjne.
  </desc>

  <defs>
    <linearGradient id="litho-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E56CF" />
      <stop offset="100%" stop-color="#4F8FFF" />
    </linearGradient>
  </defs>

  <!-- Nawiasy kodu -->
  <g
    fill="none"
    stroke="url(#litho-gradient)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M11 16 L5 24 L11 32" />
    <path d="M37 16 L43 24 L37 32" />
  </g>

  <!-- Kursor w miejscu ukośnika -->
  <path
    d="M15.6 10.1 L15.6 34.1 L20.7 29 L25.2 37.9 L29.1 35.9 L24.6 27 L32.5 27 Z"
    fill="url(#litho-gradient)"
  />
</svg>
